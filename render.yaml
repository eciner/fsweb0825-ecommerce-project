services:
  - type: web
    name: fsweb0825-ecommerce-api
    plan: free
    runtime: docker
    branch: feat/backend-api
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: fsweb0825-ecommerce-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fsweb0825-ecommerce-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fsweb0825-ecommerce-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fsweb0825-ecommerce-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fsweb0825-ecommerce-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://fsweb0825-ecommerce-project.vercel.app

databases:
  - name: fsweb0825-ecommerce-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
